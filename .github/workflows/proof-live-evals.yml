name: Proof Practice live Jev evaluations

on:
  workflow_dispatch:
    inputs:
      allow_paid:
        description: "Authorize paid Jev calls (smoke: 7; full: 19 per repeat)"
        required: true
        type: boolean
        default: false
      suite:
        description: "Smoke covers valid, invalid, custom, and comparison cases"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke
      repeat:
        description: "Runs per case; maximum 57 calls for full × 3"
        required: true
        type: choice
        options:
          - "1"
          - "3"
        default: "1"
      model:
        description: "Pinned Jev model ID (no typesafe: prefix)"
        required: true
        type: string
        default: "jev-1.13.0"

permissions:
  contents: read

concurrency:
  group: proof-practice-live-evals
  cancel-in-progress: false

jobs:
  live-jev:
    name: Grade curated proofs with real Jev
    # Never expose credentials to PR code or non-default branches.
    if: >-
      inputs.allow_paid &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: proof-evals
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proof_practice/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Check the harness before paid inference
        run: uv run --locked pytest tests/test_evals.py -q
      - name: Evaluate real proofs against the live model
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_REPEAT: ${{ inputs.repeat }}
          EVAL_MODEL: ${{ inputs.model }}
          TYPESAFE_LOG_LEVEL: warning
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TYPESAFE_API_KEY:-}" ]]; then
            echo "::error::Set TYPESAFE_API_KEY in the proof-evals environment or repository secrets."
            exit 1
          fi
          if [[ "$EVAL_REPEAT" != "1" && "$EVAL_REPEAT" != "3" ]]; then
            echo "::error::Repeat must be 1 or 3."
            exit 1
          fi
          if [[ ! "$EVAL_MODEL" =~ ^jev-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Model must be a Jev ID with no provider prefix."
            exit 1
          fi
          cases=()
          case "$EVAL_SUITE" in
            smoke)
              max_calls=$((7 * EVAL_REPEAT))
              cases=(
                --case correct-even-sum
                --case examples-are-not-a-proof
                --case circular-even-square
                --case custom-sqrt-two-correct
                --case custom-false-claim
                --case comparison-polish-does-not-fix-circularity
              )
              ;;
            full) max_calls=$((19 * EVAL_REPEAT)) ;;
            *) echo "::error::Unknown suite."; exit 1 ;;
          esac
          uv run --locked python -m evals --list "${cases[@]}" --repeat "$EVAL_REPEAT" --max-calls "$max_calls"
          uv run --locked python -m evals --allow-paid "${cases[@]}" \
            --repeat "$EVAL_REPEAT" --max-calls "$max_calls" --concurrency 1 --model "$EVAL_MODEL" \
            --output eval-results/github-live.json
      - name: Publish evaluation summary
        if: always()
        shell: bash
        run: |
          if [[ -s eval-results/github-live.json ]]; then
            uv run --locked python -m evals.summary eval-results/github-live.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete evaluation report was produced. Check the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report, including failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-practice-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof_practice/backend/eval-results/*.json
          if-no-files-found: warn
          retention-days: 14
