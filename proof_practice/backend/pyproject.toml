[project]
name = "proof-practice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-ai-slim>=1,<2",
  "pydantic-settings>=2.8,<3",
  "typesafe-sdk>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
