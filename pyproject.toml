[project]
name = "jev-examples"
version = "0.1.0"
description = "Toy Jev benchmarks for customer-support tasks and sentiment classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[typesafe]>=2.52.0",
    "tqdm>=4.67,<5",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["abcd_benchmark/tests", "bitext_benchmark/tests", "sentiment_benchmark/tests"]
pythonpath = ["."]
